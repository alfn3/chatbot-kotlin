          <p class="text-xs font-bold text-white tracking-tight leading-snug">
            D20.089500001234 <span class="text-blue-100 font-medium">(Lesti)</span>
          </p>
          <span class="text-[11px] text-blue-100/80 font-normal mt-0.5">Paket Data XL 20K</span>

        <div class="flex items-center space-x-1 shrink-0 pt-0.5">
          <span class="text-xs font-bold text-white">Rp22.000</span>
        </div>
      </div>
    </div>

    <!-- Total Section -->
    <div class="mt-2.5 pt-2.5 border-t border-white/20 flex items-baseline justify-between" data-purpose="batch-total">
      <span class="text-xs text-blue-100 font-medium">Total (2 Item)</span>

    </div>

    <!-- Action Buttons inside Bubble -->
    <div class="grid grid-cols-2 gap-2 mt-3" data-purpose="batch-card-actions">
      <button class="w-full py-2 px-3 bg-white/15 hover:bg-white/25 active:bg-white/30 text-white font-bold text-xs rounded-xl uppercase tracking-wider transition-colors text-center" type="button">

      <button class="w-full py-2 px-3 bg-white hover:bg-blue-50 active:bg-slate-100 text-brand-600 font-bold text-xs rounded-xl uppercase tracking-wider transition-all shadow-sm text-center" type="button">
        Proses
